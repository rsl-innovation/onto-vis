name: Release

# Tag a version to ship it:
#   npm version minor && git push --follow-tags
#
# Requires two repository secrets. Each publish step is skipped when its token
# is absent, so a tag still produces a GitHub release with the .vsix attached
# even before the marketplace accounts exist.
#
#   VSCE_PAT  Azure DevOps PAT, scope "Marketplace > Manage"
#             https://marketplace.visualstudio.com/manage
#   OVSX_PAT  Open VSX access token
#             https://open-vsx.org/user-settings/tokens

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A tag that disagrees with the manifest publishes the wrong version
      # under the right name, which cannot be undone on the marketplace.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package --out onto-vis.vsix

      # Both CLIs read their token from the environment; passing it as an
      # argument would expose it in process listings and command echo.
      #
      # --skip-duplicate makes a re-run safe. Publishing to one registry can
      # succeed while the other is still unconfigured, so the same version
      # legitimately gets published twice: without this, adding the second
      # token later and re-running would fail on the registry that already has
      # it, rather than filling the gap.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath onto-vis.vsix --skip-duplicate

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish onto-vis.vsix --skip-duplicate

      - name: Note skipped publishes
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: |
          [ -z "$VSCE_PAT" ] && echo "::warning::VSCE_PAT not set - skipped the VS Code Marketplace."
          [ -z "$OVSX_PAT" ] && echo "::warning::OVSX_PAT not set - skipped Open VSX."
          true

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: onto-vis.vsix
          generate_release_notes: true
