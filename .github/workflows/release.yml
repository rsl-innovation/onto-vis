name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Package
        run: npx vsce package --out turtle-syntax-extension-${{ github.ref_name }}.vsix

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: turtle-syntax-extension-${{ github.ref_name }}.vsix
          generate_release_notes: true
