name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not just the feature.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead?
